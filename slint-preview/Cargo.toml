[package]
name = "pocket-pet-slint"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Internal full-repaint API: keep pinned to the Slint version.
i-slint-core = "=1.17.1"
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Shell"] }

raw-window-handle = "0.6"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
resvg = { version = "0.47", default-features = false }

[build-dependencies]
slint-build = "1.13"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
